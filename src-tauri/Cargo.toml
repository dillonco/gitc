[package]
name = "gitc"
version = "0.1.0"
description = "A small-footprint desktop git client"
authors = ["gitc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gitc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
