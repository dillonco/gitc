[package]
name = "kgit"
version = "0.1.0"
description = "A small-footprint desktop git client"
authors = ["kgit"]
edition = "2021"
license-file = "../LICENSE"
publish = false
rust-version = "1.77"

[lib]
name = "kgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
