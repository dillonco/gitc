name: Release

# Run from the Actions tab (or `gh workflow run release.yml`) after bumping
# "version" in package.json on main. Builds a universal macOS app, signs it
# with the Developer ID certificate, notarizes it, and publishes a GitHub
# Release tagged v<version>. Installed copies pick it up through the updater,
# which reads latest.json from the newest release.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Bump \"version\" in package.json first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # notarytool reads the App Store Connect API key from a file.
      - name: Write App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Developer ID signing; the CLI imports the .p12 into a temporary keychain.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          # Notarization.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          # Signs the update bundle so installed copies can verify it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # tauri.release.conf.json adds the .dmg and the signed update bundle.
          args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: kGit v__VERSION__
          releaseBody: Download the .dmg below, open it, and drag kGit to Applications. Installed copies update themselves.
          releaseDraft: false
          prerelease: false
